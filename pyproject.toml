[project]
name = "amyntor"
version = "0.1.0"
description = "Defensive incident-snapshot triage research and engineering"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.20,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.406,<2",
    "pytest>=8.4,<9",
    "ruff>=0.14,<0.15",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
minversion = "8.4"
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]
